<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Пандитджи</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/pand32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/pand16.png">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root {
  /* Палитра — единая токен-система Panditji (см. design_handoff_home). */
  --bg:        oklch(0.965 0.010 235);
  --bg-deep:   oklch(0.93  0.018 240);
  --hairline:  oklch(0.88  0.018 235);

  --ink:       oklch(0.32 0.060 250);
  --ink-2:     oklch(0.25 0.060 250);
  --ink-soft:  oklch(0.44 0.055 250);

  --text:      oklch(0.27 0.030 245);
  --text-2:    oklch(0.50 0.022 240);
  --text-3:    oklch(0.62 0.015 240);
  --text-4:    oklch(0.72 0.010 240);

  --terra:      oklch(0.74 0.095 28);
  --terra-deep: oklch(0.60 0.115 25);
  --terra-soft: oklch(0.93 0.035 35);

  --sage:       oklch(0.74 0.065 225);
  --sage-deep:  oklch(0.52 0.085 235);
  --sage-soft:  oklch(0.92 0.035 225);

  --gold:       oklch(0.76 0.060 290);
  --gold-deep:  oklch(0.50 0.10  295);

  --green:      oklch(0.62 0.10 150);
  --green-deep: oklch(0.46 0.085 150);
  --green-soft: oklch(0.93 0.030 150);

  --neg:        oklch(0.62 0.085 28);
  --neg-deep:   oklch(0.50 0.10  25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100vh; }
body {
  font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  font-size: 15.33px;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background:
    radial-gradient(80% 70% at 85% 5%,  oklch(0.85 0.05 250 / 0.20) 0%, transparent 75%),
    radial-gradient(75% 65% at 8% 28%,  oklch(0.84 0.045 230 / 0.22) 0%, transparent 78%),
    radial-gradient(85% 60% at 95% 80%, oklch(0.86 0.04 290 / 0.16) 0%, transparent 75%),
    radial-gradient(70% 55% at 12% 100%, oklch(0.82 0.045 30 / 0.14) 0%, transparent 80%),
    linear-gradient(180deg, oklch(0.965 0.010 235), oklch(0.94 0.016 235));
  background-attachment: fixed;
  min-height: 100dvh;
}
.num { font-feature-settings: "tnum" 1; font-variant-numeric: tabular-nums; }
.font-serif-m { font-family: 'EB Garamond', Georgia, serif; }
.sep { color: var(--text-4); margin: 0 0.4em; font-weight: 500; }

/* ============ Контейнер страницы (мобильный, base 360px) ============ */
.app {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 0 56px;
  position: relative;
}

/* ============ PAGE META (шапка) — 3-колонки вокруг лого ============ */
.page-meta--capsule {
  position: relative;
  margin: 4px 16px 18px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 0 14px;
  padding: 0;
  min-height: 52px;
}
.page-meta--capsule .pm-left {
  display: flex; flex-direction: column;
  align-items: flex-start; justify-content: center; gap: 4px;
  min-width: 0;
}
.page-meta--capsule .pm-right {
  display: flex; flex-direction: column;
  align-items: flex-end; justify-content: center; gap: 4px;
  min-width: 0;
}
.page-meta--capsule .pm-date {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-family: 'EB Garamond', Georgia, serif;
  line-height: 1;
}
.page-meta--capsule .pm-day {
  font-size: 27.33px; font-weight: 500; color: var(--ink-2);
  letter-spacing: -0.015em; line-height: 0.9;
  font-feature-settings: "lnum" 1;
}
.page-meta--capsule .pm-month {
  font-size: 19.33px; font-weight: 500; color: var(--ink-2);
  font-style: italic; line-height: 1;
}
.page-meta--capsule .pm-vaish-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'EB Garamond', Georgia, serif;
  font-style: italic; font-size: 14.33px;
  color: var(--terra-deep);
  white-space: nowrap;
}
.page-meta--capsule .pm-vaish-chip svg { color: var(--terra-deep); opacity: 0.9; }
.page-meta--capsule .pm-loc {
  font-size: 13.33px; font-weight: 500;
  letter-spacing: 0.005em;
  color: var(--text-2);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
  cursor: pointer;
  background: transparent; border: 0; padding: 0;
  font-family: inherit;
}
.page-meta--capsule .pm-loc::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--terra-deep);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--terra) 22%, transparent);
}
.page-meta--capsule .pm-temp {
  font-size: 17.33px; font-weight: 600; color: var(--ink-2);
  letter-spacing: -0.01em; line-height: 1;
  display: inline-flex; align-items: baseline; gap: 4px;
}

/* hairline under the diary header */
.page-meta--capsule::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -8px;
  height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--ink) 16%, transparent), transparent);
}

.brand-link {
  display: inline-block;
  flex: none;
  line-height: 0;
  cursor: pointer;
  border-radius: 50%;
  transition: transform .12s ease, opacity .12s ease;
  -webkit-tap-highlight-color: transparent;
}
.brand-link:hover { opacity: 0.85; }
.brand-link:active { transform: scale(0.94); opacity: 0.7; }
.brand-mark {
  width: 52px; height: 52px;
  border-radius: 50%;
  opacity: 0.95;
  filter: drop-shadow(0 4px 12px oklch(0.30 0.06 250 / 0.20));
  display: block;
  pointer-events: none;
}

/* ============ КАРТОЧКА .hc ============ */
.hc {
  margin: 0 14px 14px;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(255,255,255,0.72);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border-radius: 18px;
  padding: 14px 14px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 1px 2px oklch(0.30 0.06 250 / 0.04),
    0 10px 26px -18px oklch(0.30 0.06 250 / 0.18);
  position: relative;
}

.hc--japa {
  background:
    radial-gradient(110% 90% at 0% 0%, color-mix(in oklch, var(--green) 18%, transparent), transparent 60%),
    linear-gradient(180deg, color-mix(in oklch, var(--green-soft) 70%, white 30%) 0%, rgba(255,255,255,0.55) 100%);
  border-color: color-mix(in oklch, var(--green) 28%, rgba(255,255,255,0.7));
}
.hc--japa .card-title-text { color: var(--green-deep); }

.hc--health {
  background:
    radial-gradient(110% 90% at 100% 0%, color-mix(in oklch, var(--sage) 22%, transparent), transparent 60%),
    linear-gradient(180deg, color-mix(in oklch, var(--sage-soft) 50%, white 50%) 0%, rgba(255,255,255,0.55) 100%);
  border-color: color-mix(in oklch, var(--sage) 28%, rgba(255,255,255,0.7));
}
.hc--health .card-title-text { color: var(--sage-deep); }

.hc--tasks {
  background:
    radial-gradient(110% 90% at 0% 100%, color-mix(in oklch, var(--terra) 18%, transparent), transparent 60%),
    linear-gradient(180deg, color-mix(in oklch, var(--terra-soft) 60%, white 40%) 0%, rgba(255,255,255,0.55) 100%);
  border-color: color-mix(in oklch, var(--terra) 28%, rgba(255,255,255,0.7));
}
.hc--tasks .card-title-text { color: var(--terra-deep); }

.hc--cal {
  background:
    radial-gradient(110% 90% at 100% 100%, color-mix(in oklch, var(--gold) 22%, transparent), transparent 60%),
    linear-gradient(180deg, color-mix(in oklch, oklch(0.92 0.045 290) 50%, white 50%) 0%, rgba(255,255,255,0.55) 100%);
  border-color: color-mix(in oklch, var(--gold) 30%, rgba(255,255,255,0.7));
}
.hc--cal .card-title-text { color: var(--gold-deep); }

/* Chevron-вниз снизу карточки как явный аффорданс toggle.
 * В свёрнутом — направлен вниз («разверни»), в раскрытом — флип на 180° («сверни»). */
.hc { cursor: pointer; padding-bottom: 22px; }
.hc::before {
  content: "";
  position: absolute;
  left: 50%; bottom: 6px;
  width: 16px; height: 8px;
  transform: translateX(-50%);
  background-image:
    linear-gradient(135deg, transparent 40%, color-mix(in oklch, var(--ink) 30%, transparent) 40% 55%, transparent 55%),
    linear-gradient(45deg,  transparent 40%, color-mix(in oklch, var(--ink) 30%, transparent) 40% 55%, transparent 55%);
  background-size: 8px 8px;
  background-repeat: no-repeat;
  background-position: 0 0, 8px 0;
  opacity: 0.5;
  pointer-events: none;
  transition: opacity .12s ease, transform .15s ease;
}
.hc:hover::before { opacity: 0.85; }
.hc[data-collapsed="false"]::before {
  transform: translateX(-50%) rotate(180deg);
}

/* Вертикальная цветная полоса слева */
.hc::after {
  content: "";
  position: absolute; left: 0; top: 18px; bottom: 18px;
  width: 3px; border-radius: 0 3px 3px 0;
  opacity: 0.55;
  pointer-events: none;
}
.hc--japa::after   { background: var(--green-deep); }
.hc--health::after { background: var(--sage-deep); }
.hc--tasks::after  { background: var(--terra-deep); }
.hc--cal::after    { background: var(--gold-deep); }

/* ============ Шапка карточки ============ */
.hc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-title { display: flex; align-items: baseline; gap: 0; flex: none; }
.card-title-btn {
  display: inline-flex; align-items: center; gap: 4px;
  background: transparent; border: 0; padding: 0; cursor: pointer;
  font: inherit;
  color: inherit;
  text-decoration: none;
}
.card-title-text {
  font-size: 18.33px; font-weight: 700;
  color: var(--ink-2);
  letter-spacing: -0.005em;
}
.card-title-arrow {
  display: inline-flex; opacity: 0.55; color: var(--ink-soft);
  margin-left: 2px; margin-top: 1px;
}
.card-title-btn:hover .card-title-arrow,
.card-title-btn:focus-visible .card-title-arrow { opacity: 0.9; }

.hc-head-meta {
  font-family: 'EB Garamond', Georgia, serif;
  font-style: italic;
  font-size: 14.33px; color: var(--ink-soft); font-weight: 500;
  display: inline-flex; align-items: center; gap: 5px;
  text-align: right; line-height: 1.3;
  letter-spacing: 0.005em;
}
.hc-head-meta--stack { flex-direction: column; align-items: flex-end; gap: 1px; line-height: 1.15; }
.hh-line1 { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 14.83px; color: var(--ink-soft); font-weight: 500; }
.hh-line2 { font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 12.33px; color: var(--text-3); letter-spacing: 0.005em; }
.hc-head-meta .ov { color: var(--terra-deep); font-weight: 600; }
.hc-head-meta--counters {
  font-family: 'Manrope', sans-serif; font-style: normal;
  font-size: 12.33px; color: var(--text-3);
  display: inline-flex; flex-wrap: wrap; justify-content: flex-end;
  row-gap: 1px; column-gap: 8px;
  max-width: 210px; text-align: right; line-height: 1.4;
}
.hc-head-meta--counters > span { display: inline-flex; align-items: baseline; white-space: nowrap; gap: 4px; }

/* Тело карточки */
.hc-body { display: flex; flex-direction: column; gap: 12px; }
.hc-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--hairline), transparent); opacity: 0.7; margin: 2px 0; }

/* ============ 3-метрики (Джапа) ============ */
.m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.m-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.m-label {
  font-size: 10.83px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.10em; color: var(--text-3);
  white-space: nowrap;
}
.m-today {
  font-size: 25.33px; font-weight: 700;
  color: var(--ink-2);
  letter-spacing: -0.025em; line-height: 1.05;
  display: flex; align-items: baseline; gap: 1px;
}
.m-unit { font-size: 13.33px; font-weight: 600; opacity: 0.55; margin-left: 1px; }
.m-baseline { font-size: 11.83px; color: var(--text-3); font-weight: 500; line-height: 1.25; margin-top: 1px; }
.m-baseline-empty { color: var(--text-4); }
.m-delta { font-size: 12.33px; font-weight: 600; line-height: 1.2; margin-top: 1px; }
.m-delta-empty { color: transparent; }

/* Дельты */
.delta { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -0.005em; }
.delta--pos     { color: var(--green-deep); }
.delta--neg     { color: var(--neg-deep); }
.delta--neutral { color: var(--text-2); font-weight: 600; }

/* ============ Стрики / sparse / milestone ============ */
.streaks { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
.streak-line {
  font-size: 12.83px; color: var(--text-3); font-weight: 500;
  letter-spacing: 0.005em;
  display: flex; align-items: center; gap: 8px;
}
.streak-line::before {
  content: ""; width: 14px; height: 1px;
  background: var(--text-4); opacity: 0.5; flex: none;
}
.sparse-note {
  font-family: 'EB Garamond', Georgia, serif;
  font-style: italic; font-size: 17.33px; font-weight: 500;
  color: var(--text-2); line-height: 1.45;
}
.milestone-line {
  font-family: 'EB Garamond', Georgia, serif;
  font-style: italic; font-size: 15.33px; color: var(--terra-deep);
}

/* ============ Кнопки действий ============ */
.hc-actions { display: flex; gap: 8px; }
.hc-actions--end {
  justify-content: flex-end; padding-top: 2px;
  border-top: 1px solid color-mix(in oklch, var(--hairline) 55%, transparent);
  margin-top: 4px;
}
.act-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; cursor: pointer; padding: 8px 12px; border-radius: 999px;
  font-size: 13.83px; font-weight: 600; letter-spacing: -0.005em;
  transition: transform .12s ease, background .12s ease;
  border: 0; background: transparent;
  color: var(--ink-soft);
  text-decoration: none;
}
.act-btn:active { transform: scale(0.97); }
.act-btn--primary {
  background: var(--ink-2); color: oklch(0.98 0.005 235);
  padding: 9px 14px 9px 12px;
  box-shadow: 0 4px 14px -6px oklch(0.30 0.06 250 / 0.50), 0 1px 0 rgba(255,255,255,0.2) inset;
}
.act-btn--primary svg { fill: currentColor; }
.act-btn--ghost { padding: 8px 0; color: var(--ink-soft); }
.act-btn--ghost:hover { color: var(--ink-2); }

/* ============ Джапа — список сессий ============ */
.sub-eyebrow {
  font-family: 'EB Garamond', Georgia, serif;
  font-style: italic; font-size: 14.83px; font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 4px;
  letter-spacing: 0.005em;
}
.sessions-list { display: flex; flex-direction: column; }
.sess-row {
  display: flex; align-items: baseline; gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid color-mix(in oklch, var(--hairline) 60%, transparent);
  font-size: 13.83px;
  white-space: nowrap;
  text-decoration: none; color: inherit;
}
.sess-row:last-child { border-bottom: 0; }
.sess-date { color: var(--text-2); font-weight: 500; flex: none; min-width: 60px; }
.sess-mid { color: var(--text-3); font-size: 12.83px; flex: 1; min-width: 0; }
.sess-mid .sep { color: var(--text-4); margin: 0 4px; }
.sess-deep { color: var(--ink-2); font-weight: 700; flex: none; }

/* ============ Здоровье — кольца ============ */
.hr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: start; }
.hr-cell {
  display: flex; flex-direction: column; align-items: flex-start;
  gap: 5px; min-width: 0;
  padding-right: 4px;
}
a.hr-cell, a.hr-cell--link {
  text-decoration: none; color: inherit;
  cursor: pointer;
  transition: opacity .12s ease;
}
a.hr-cell:active { opacity: 0.7; }
a.extra-row {
  text-decoration: none; color: inherit;
  cursor: pointer;
  transition: opacity .12s ease;
}
a.extra-row:active { opacity: 0.7; }
.hr-row-top { display: flex; align-items: center; gap: 8px; width: 100%; }
.hr-ring-wrap { position: relative; width: 38px; height: 38px; flex: none; }
.hr-ring-baseline {
  position: absolute; inset: 0;
  pointer-events: none;
  transform: rotate(calc(var(--bp, 0) * 3.6deg));
}
.hr-ring-baseline::before {
  content: "";
  position: absolute; left: 50%; top: 0;
  width: 2px; height: 4px;
  background: var(--ink-2);
  transform: translate(-50%, -1px);
  opacity: 0.55;
  border-radius: 1px;
}
.hr-ring {
  --p: 0;
  width: 100%; height: 100%;
  border-radius: 50%;
  background: conic-gradient(currentColor calc(var(--p) * 1%), color-mix(in oklch, currentColor 10%, transparent) 0);
  position: relative;
}
.hr-ring::after {
  content: ""; position: absolute; inset: 4px;
  background: rgba(255,255,255,0.95); border-radius: 50%;
}
.hr-num-big {
  font-size: 20.33px; font-weight: 700; color: var(--ink-2);
  letter-spacing: -0.02em; line-height: 1;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 1px;
}
.hr-num-big .hr-num-unit { font-size: 11.33px; font-weight: 600; opacity: 0.55; }
.hr-ring--sage { color: var(--sage-deep); }
.hr-ring--ink  { color: var(--ink-soft); }
.hr-ring--gold { color: var(--gold-deep); }
.hr-label {
  font-size: 10.83px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.10em; color: var(--text-3);
  white-space: nowrap;
}
.hr-base {
  font-family: 'EB Garamond', Georgia, serif;
  font-style: italic; font-size: 13.33px; color: var(--text-3);
  line-height: 1.15; white-space: nowrap;
}
.hr-delta { font-size: 12.33px; font-weight: 600; margin-top: 1px; line-height: 1.2; white-space: nowrap; }

/* Дополнительные ряды (Здоровье в раскрытом) */
.extra-grid { display: flex; flex-direction: column; }
.extra-row {
  display: flex; align-items: baseline; gap: 0;
  padding: 10px 0;
  border-bottom: 1px solid color-mix(in oklch, var(--hairline) 55%, transparent);
}
.extra-row:last-child { border-bottom: 0; }
.extra-label { font-size: 14.33px; color: var(--text-2); font-weight: 500; flex: 1; min-width: 0; }
.extra-today {
  font-size: 15.33px; color: var(--ink-2); font-weight: 700; letter-spacing: -0.005em;
  display: inline-flex; align-items: baseline; gap: 3px;
  flex: none; min-width: 86px; justify-content: flex-end;
  white-space: nowrap;
}
.extra-unit { font-size: 11.83px; font-weight: 600; opacity: 0.55; margin-left: 1px; }
.extra-base { font-size: 11.83px; color: var(--text-3); flex: none; min-width: 88px; text-align: right; padding-left: 8px; white-space: nowrap; }
.extra-meta { color: var(--text-3); font-style: italic; font-family: 'EB Garamond', Georgia, serif; font-size: 13.33px; font-weight: 500; }
.extra-delta { font-size: 12.83px; flex: none; min-width: 56px; text-align: right; padding-left: 10px; }

/* ============ Задачи ============ */
.hb-checkbox {
  width: 24px; height: 24px; border-radius: 7px;
  background: rgba(255,255,255,0.7);
  border: 1.5px solid color-mix(in oklch, var(--ink) 18%, transparent);
  display: grid; place-items: center;
  cursor: pointer; flex: none;
  color: white;
  transition: background .15s, border-color .15s;
  padding: 0;
}
.hb-checkbox.is-checked {
  background: var(--ink-2);
  border-color: var(--ink-2);
  box-shadow: 0 3px 8px -3px oklch(0.30 0.06 250 / 0.45);
}
.task-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid color-mix(in oklch, var(--hairline) 55%, transparent);
}
.task-row:last-child { border-bottom: 0; }
.task-row .task-text { flex: 1; min-width: 0; padding-top: 2px; }
.task-row .task-text > div:first-child {
  font-size: 15.33px; font-weight: 500; color: var(--text);
  line-height: 1.35; text-wrap: pretty;
}

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;')

const pad2 = (n) => String(n).padStart(2, '0')

const fmt = {
  /* Дробное с русской запятой ("12,5") или целое. */
  num(v, decimals = 0) {
    if (v == null) return '—'
    if (decimals === 0) return String(Math.round(v))
    return v.toFixed(decimals).replace('.', ',')
  },
  /* "+18" / "−4" / "±0", с суффиксом. */
  signed(v, opts = {}) {
    const { decimals = 0, suffix = '' } = opts
    if (v === 0) return `±0${suffix}`
    const sign = v > 0 ? '+' : '−'
    return `${sign}${this.num(Math.abs(v), decimals)}${suffix}`
  },
  /* Секунды в "M:SS". */
  ms(sec) {
    const a = Math.abs(sec || 0)
    return `${Math.floor(a / 60)}:${pad2(a % 60)}`
  },
  /* Дельта-секунды в "+M:SS"/"−M:SS". */
  signedMS(sec) {
    if (sec === 0) return '±0:00'
    const sign = sec >= 0 ? '+' : '−'
    const a = Math.abs(sec)
    return `${sign}${Math.floor(a / 60)}:${pad2(a % 60)}`
  },
  /* { h, m } → "H:MM". */
  hm({ h, m }) { return `${h}:${pad2(m)}` },
  /* Минуты → "1ч 28м" / "45 мин". Округляем до целых минут — без хвостов плавающей точки. */
  durMin(min) {
    const total = Math.round(min)
    if (total >= 60) {
      const h = Math.floor(total / 60), m = total % 60
      return m ? `${h}ч ${m}м` : `${h}ч`
    }
    return `${total} мин`
  },
  temp(t) { return `${t > 0 ? '+' : t < 0 ? '−' : ''}${Math.abs(t)}°C` },
}

/* Цвет дельты — pos/neg/neutral по правилам брифа:
 *   inverted=true  → знак инвертируется (RHR: ниже = лучше)
 *   neutral=true   → всегда нейтрально (Strain, вес)
 *   |Δ| ≤ 5% базы  → нейтрально (deadzone) */
function deltaTone(delta, baseline, opts = {}) {
  const { inverted = false, neutral = false, deadZonePct = 5 } = opts
  if (neutral || delta == null) return 'neutral'
  if (baseline == null || baseline === 0) return 'neutral'
  const pct = Math.abs(delta) / Math.abs(baseline) * 100
  if (pct <= deadZonePct) return 'neutral'
  const better = inverted ? delta < 0 : delta > 0
  return better ? 'pos' : 'neg'
}

  japa:    'pj:swr:japa',
  health:  'pj:swr:health',
  tasks:   'pj:swr:tasks',
  cal:     'pj:swr:cal',
}
function swrRead(key) {
  try {
    const raw = localStorage.getItem(SWR_KEYS[key])
    return raw ? JSON.parse(raw) : null
  } catch { return null }
}
function swrWrite(key, data) {
  try { localStorage.setItem(SWR_KEYS[key], JSON.stringify(data)) } catch {}
}

 *  Кэшируем глобально, чтобы карточки могли использовать tz для todayISO/календаря.

/* Initial defaults берём из браузера — это TZ реального места пребывания.
 * loadProfile() позже подгрузит name+tz из user_profile.current_location и при
 * необходимости обновит шапку и tz карточек. */
const PROFILE = {
  tz: (() => {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Moscow' }
    catch { return 'Europe/Moscow' }
  })(),
  locationName: '…',
  temperature: null,
}

async function loadProfile() {
  if (PREVIEW) return { tz: 'Asia/Kolkata', locationName: 'Говардхан' }
  try {
    const { data, error } = await db
      .from('user_profile')
      .select('location:current_location_id(name, timezone)')
      .eq('id', user.id)
      .maybeSingle()
    if (error) throw error
    const loc = data?.location
    if (loc?.timezone && loc?.name) {
      return { tz: loc.timezone, locationName: loc.name }
    }
  } catch (e) {
    console.warn('profile load failed', e)
  }
  return { tz: 'Asia/Kolkata', locationName: 'Говардхан' }
}

/* Проактивный pull с Whoop. Условия:
 *   1) Локальное время >= 3:00 (раньше Whoop ещё не записал ночь).
 *   2) В БД нет whoop_recovery с date == локальное «сегодня».
 *   3) С прошлого pull прошло > 60 сек (throttle, чтобы не упереться в
 *      Whoop API rate-limit 10 req/min при быстрых перезагрузках).
 * Возвращает true, если успешно дёрнули и стоит перезагрузить карточку. */
const WHOOP_THROTTLE_KEY = 'pj:home:whoop-fetch-last'
const WHOOP_THROTTLE_MS = 60 * 1000

async function maybeRefreshWhoop() {
  if (PREVIEW) return false
  /* Берём TZ устройства, а не PROFILE.tz: пользователь может физически быть
   * не в той локации, что стоит в user_profile.current_location_id
   * (автоопределения локации пока нет — пометили TODO). */
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone
  const now = new Date()
  const localHour = Number(new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: 'numeric', hourCycle: 'h23',
  }).format(now))
  if (localHour < 3) return false

  const todayLocal = todayISO(tz)
  const { data: rec, error: recErr } = await db
    .from('whoop_recovery')
    .select('date')
    .eq('date', todayLocal)
    .maybeSingle()
  if (recErr) { console.warn('whoop recovery check failed', recErr); return false }
  if (rec) return false

  const last = Number(localStorage.getItem(WHOOP_THROTTLE_KEY) || 0)
  if (Date.now() - last < WHOOP_THROTTLE_MS) return false
  localStorage.setItem(WHOOP_THROTTLE_KEY, String(Date.now()))

  console.info('whoop-fetch: pulling fresh data...')
  const { error: fErr } = await db.functions.invoke('whoop-fetch')
  if (fErr) { console.warn('whoop-fetch failed', fErr); return false }
  return true
}

function todayISO(tz) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date())
}

async function loadTasks() {

  const today = todayISO(tz)

  const { data, error } = await db
    .from('tasks')
    .select('id, text, due_date, due_time, status, completed_at')
    .order('due_date', { ascending: true })
    .order('due_time', { ascending: true, nullsFirst: false })

  if (error) throw error

  const open = [], doneList = [], overdue = []
  for (const t of data || []) {
    const done = t.status === 'done'
    const isToday = t.due_date === today
    const isOverdue = !done && t.due_date && t.due_date < today

    if (isOverdue) {
      overdue.push({ id: t.id, text: t.text, since: sinceText(t.due_date, today) })
      continue
    }
    if (isToday) {
      const row = { id: t.id, text: t.text, time: t.due_time?.slice(0, 5) || null, done, completedAt: t.completed_at }
      if (done) doneList.push(row)
      else open.push(row)
    }
  }
  /* Сначала открытые, затем выполненные (свежевыполненные внизу — по completed_at desc). */
  doneList.sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''))
  const todays = [...open, ...doneList]

  const counters = { today: todays.length, overdue: overdue.length, done: doneList.length }
  const state = (todays.length === 0 && overdue.length === 0) ? 'empty' : 'normal'

  return { state, counters, todays, overdue, streak: null /* TODO */ }
}

function sinceText(dueISO, todayISO) {
  const a = new Date(dueISO + 'T00:00:00'), b = new Date(todayISO + 'T00:00:00')
  const days = Math.round((b - a) / 86400000)
  if (days === 1) return 'вчера'
  if (days < 7) return `${days} дня назад`
  return `${days} дней назад`
}

/* Создать задачу на сегодня. */
async function createTaskInline(text) {
  if (PREVIEW) {
    cache.tasks.todays.push({ id: 'p-' + Date.now(), text, done: false })
    cache.tasks.counters.today++
    return
  }
  const tz = PROFILE.tz
  const due_date = todayISO(tz)
  const { error } = await db.from('tasks').insert({
    user_id: user.id,
    text,
    due_date,
    source: 'web',
  })
  if (error) throw error
}

/* Полное удаление задачи. У done-задач справа есть крестик, чтобы убрать
 * выполненное с глаз — иначе зачёркнутые накапливаются. */
async function deleteTask(id) {
  if (PREVIEW) {
    const t = cache.tasks.todays.find(x => x.id === id)
    if (!t) return
    cache.tasks.todays = cache.tasks.todays.filter(x => x.id !== id)
    cache.tasks.counters.today--
    if (t.done) cache.tasks.counters.done--
    return
  }
  const { error } = await db.from('tasks').delete().eq('id', id)
  if (error) throw error
}

/* Toggle done. status: open ↔ done, completed_at соответственно. */
async function toggleTaskDone(id) {
  if (PREVIEW) {
    const t = cache.tasks.todays.find(x => x.id === id)
    if (t) {
      t.done = !t.done
      t.completedAt = t.done ? new Date().toISOString() : null
      cache.tasks.counters.done += t.done ? 1 : -1
      /* Пересортируем — open сверху, done снизу (свежевыполненные первые). */
      cache.tasks.todays.sort((a, b) => {
        if (a.done !== b.done) return Number(a.done) - Number(b.done)
        if (a.done) return (b.completedAt || '').localeCompare(a.completedAt || '')
        return 0
      })
    }
    return
  }
  const { data: row, error: e1 } = await db.from('tasks').select('status').eq('id', id).single()
  if (e1) throw e1
  const willBeDone = row.status !== 'done'
  const { error: e2 } = await db.from('tasks').update({
    status: willBeDone ? 'done' : 'open',
    completed_at: willBeDone ? new Date().toISOString() : null,
  }).eq('id', id)
  if (e2) throw e2
}

/* ────────────────────────────────────────────────────────────────
 *  Карточка 4 — Календарь
 *  Источник: calendar_events (миграция 011)
 * ──────────────────────────────────────────────────────────────── */
async function loadCalendar() {
  if (PREVIEW) return MOCK.calendar
  const tz = PROFILE.tz
  const today = todayISO(tz)
  const horizon = new Date(Date.now() + 14 * 24 * 3600 * 1000) // 2 недели — на всякий

  const { data, error } = await db
    .from('calendar_events')
    .select('id, title, description, start_at, end_at, google_calendar_id, is_all_day, deleted_at')
    .is('deleted_at', null)
    .gte('start_at', new Date(Date.now() - 12 * 3600 * 1000).toISOString())
    .lt('start_at', horizon.toISOString())
    .order('start_at', { ascending: true })

  if (error) {
    console.warn('calendar load failed', error)
    return { state: 'empty', todayRest: [], groups: [] }
  }

  const now = Date.now()
  /* Регэксп выдёргивает meet/zoom-ссылку из описания события — отдельного поля нет. */
  const MEET_RE = /(https?:\/\/(?:meet\.google\.com|[a-z0-9-]+\.zoom\.us|us\d+\.zoom\.us|teams\.live\.com|teams\.microsoft\.com)\/[^\s<>"']+)/i

  const all = []
  for (const ev of data || []) {
    if (ev.is_all_day) continue
    const start = new Date(ev.start_at)
    const end = ev.end_at ? new Date(ev.end_at) : new Date(start.getTime() + 30 * 60000)
    if (end.getTime() <= now) continue // прошедшие пропускаем
    const day = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(start)
    const time = new Intl.DateTimeFormat('ru-RU', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(start)
    const durMin = Math.max(1, Math.round((end - start) / 60000))
    const linkMatch = ev.description ? ev.description.match(MEET_RE) : null
    const hasLink = !!linkMatch
    const isWork = /adrian\.ru/i.test(ev.google_calendar_id || '')
    const startMs = start.getTime()
    const minutesUntil = (startMs - now) / 60000
    all.push({
      id: ev.id, day, time, title: ev.title || '(без названия)', durationMin: durMin,
      hasLink, isWork, startMs, minutesUntil, joinUrl: linkMatch ? linkMatch[1] : null,
    })
  }

  const todayRest = all.filter(e => e.day === today)

  if (todayRest.length > 0) {
    /* Сегодня есть события — показываем hero + все сегодняшние. */
    const next = todayRest[0]
    next.in = humanIn(next.minutesUntil)
    next.joinable = next.hasLink && next.minutesUntil >= 0 && next.minutesUntil <= 10
    return { state: 'next_event', next, todayRest, groups: [] }
  }

  /* Сегодня пусто — берём 3 ближайшие встречи и группируем по дням. */
  const upcoming = all.slice(0, 3)
  if (upcoming.length === 0) {
    return { state: 'empty', todayRest: [], groups: [] }
  }
  const groups = []
  for (const ev of upcoming) {
    let g = groups.find(x => x.day === ev.day)
    if (!g) {
      g = { day: ev.day, label: dayLabel(today, ev.day, tz), events: [] }
      groups.push(g)
    }
    g.events.push(ev)
  }
  return { state: 'no_more_today', todayRest: [], groups }
}

/* Лейбл дня относительно сегодня:
 *   +1 → «Завтра», +2 → «Послезавтра», +3..+6 → день недели, +7+ → «18 мая». */
function dayLabel(todayISOStr, dayISOStr, tz) {
  const a = new Date(todayISOStr + 'T00:00:00Z')
  const b = new Date(dayISOStr + 'T00:00:00Z')
  const diff = Math.round((b.getTime() - a.getTime()) / 86400000)
  if (diff === 0) return 'Сегодня'
  if (diff === 1) return 'Завтра'
  if (diff === 2) return 'Послезавтра'
  if (diff >= 3 && diff <= 6) {
    const wd = new Intl.DateTimeFormat('ru-RU', { timeZone: tz, weekday: 'long' }).format(b)
    return wd.charAt(0).toUpperCase() + wd.slice(1)
  }
  const day = Number(new Intl.DateTimeFormat('en-CA', { timeZone: tz, day: 'numeric' }).format(b))
  const monthIdx = Number(new Intl.DateTimeFormat('en-CA', { timeZone: tz, month: 'numeric' }).format(b)) - 1
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря']
  return `${day} ${months[monthIdx]}`
}

function humanIn(minutes) {
  if (minutes < 0) return `Сейчас`
  if (minutes < 60) return `${Math.round(minutes)} мин`
  const h = Math.floor(minutes / 60), m = Math.round(minutes - h * 60)
  return m ? `${h}ч ${m}м` : `${h}ч`
}

/* Русское склонение: plural(1,'a','b','c') = a, plural(2..4)='b', остальные='c'. */
function plural(n, one, few, many) {
  const mod10 = n % 10, mod100 = n % 100
  if (mod10 === 1 && mod100 !== 11) return one
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few
  return many
}

    bodyHTML = `

      ${exp ? `<div class="hc-actions hc-actions--end"><a class="act-btn act-btn--ghost" href="/calendar.html">Открыть календарь →</a></div>` : ''}

  root.innerHTML = `

/* ────────────────────────────────────────────────────────────────
 *  Раскрытие/сворачивание + перерисовка
 * ──────────────────────────────────────────────────────────────── */
const cache = { japa: null, health: null, tasks: null, cal: null }

function rerender(key) {
  if (key === 'japa')   renderJapa(cache.japa)
  if (key === 'health') renderHealth(cache.health)
  if (key === 'tasks')  renderTasks(cache.tasks)
  if (key === 'cal')    renderCalendar(cache.cal)
}

const CARD_KEY = { 'card-japa': 'japa', 'card-health': 'health', 'card-tasks': 'tasks', 'card-cal': 'cal' }

/* Toggle при тапе по контейнеру в любом состоянии (Вариант 1).
 *   - Интерактивы (data-no-toggle) — пропускают.
 *   - Title «Задачи →» — всегда ведёт на /tasks/ (это <a> с data-no-toggle).
 *   - В раскрытом виде тап «между» строк сворачивает карточку. Тап по самим
 *     строкам (data-no-toggle на task-row / sess-row / ev-tl-row / hr-cell /
 *     extra-row) не сворачивает — чтобы случайно не схлопнуть при чтении. */
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-no-toggle]')) return
  const card = e.target.closest('.hc[data-collapsed]')
  if (!card) return
  const key = CARD_KEY[card.id]
  if (!key) return
  const isExpanded = card.getAttribute('data-collapsed') === 'false'
  setExpanded(key, !isExpanded)
  rerender(key)
})

/* ────────────────────────────────────────────────────────────────
 *  Делегированные обработчики (чекбокс, форма add-task)
 * ──────────────────────────────────────────────────────────────── */
document.addEventListener('click', async (e) => {
  const cb = e.target.closest('[data-toggle-task]')
  if (!cb) return
  const id = cb.getAttribute('data-toggle-task')
  cb.disabled = true
  try {
    await toggleTaskDone(id)
    if (!PREVIEW) cache.tasks = await loadTasks()
    renderTasks(cache.tasks)
  } catch (err) {
    console.error(err)
    cb.disabled = false
  }
})

/* Удаление задачи (крестик у done-задач). */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-delete-task]')
  if (!btn) return
  const id = btn.getAttribute('data-delete-task')
  btn.disabled = true
  try {
    await deleteTask(id)
    if (!PREVIEW) cache.tasks = await loadTasks()
    renderTasks(cache.tasks)
  } catch (err) {
    console.error(err)
    btn.disabled = false
  }
})

document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'task-add-form') return
  e.preventDefault()
  const input = document.getElementById('task-add-input')
  const text = input.value.trim()
  if (!text) return
  input.disabled = true

    await createTaskInline(text)
    input.value = ''
    if (!PREVIEW) cache.tasks = await loadTasks()
    renderTasks(cache.tasks)

    document.getElementById('task-add-input')?.focus()

    console.error(err)
    input.disabled = false

/* "Ещё N →" — раскрыть карточку задач. */

  setExpanded('tasks', true)
  renderTasks(cache.tasks)

/* Повтор загрузки джапы из error state. */
document.addEventListener('click', async (e) => {
  if (e.target.id !== 'japa-retry') return
  cache.japa = await loadJapa()
  renderJapa(cache.japa)

/* ────────────────────────────────────────────────────────────────
 *  Boot — параллелим всё + stale-while-revalidate.
 *  При повторной загрузке кэш из localStorage рендерится мгновенно,
 *  параллельно живые запросы заменят данные когда придут.
 * ──────────────────────────────────────────────────────────────── */

/* SWR: показываем последние известные данные мгновенно. */
if (!PREVIEW) {
  const cP = swrRead('profile')
  if (cP) { PROFILE.tz = cP.tz; PROFILE.locationName = cP.locationName }
  const cW = swrRead('weather')
  if (typeof cW === 'number') PROFILE.temperature = cW
  const cJ = swrRead('japa');   if (cJ) { cache.japa   = cJ; renderJapa(cJ) }
  const cH = swrRead('health'); if (cH) { cache.health = cH; renderHealth(cH) }
  const cT = swrRead('tasks');  if (cT) { cache.tasks  = cT; renderTasks(cT) }
  const cC = swrRead('cal');    if (cC) { cache.cal    = cC; renderCalendar(cC) }
}

renderHeader(getHeaderData())

/* Bundle: profile + weather + health одним вызовом. Когда придёт, обновляем
 * всё сразу. Если TZ изменился — перезагружаем tasks/calendar (они от него зависят).
 * В PREVIEW режиме bundle = null, используем mock через loadHealth напрямую. */
if (PREVIEW) {
  loadHealth().then(d => { cache.health = d; renderHealth(d) })
}
const bundlePromise = loadHomeBundle()
bundlePromise.then(b => {
  if (!b) return
  let tzChanged = false
  if (b.profile?.tz) {
    tzChanged = b.profile.tz !== PROFILE.tz
    PROFILE.tz = b.profile.tz
    PROFILE.locationName = b.profile.locationName || PROFILE.locationName
    swrWrite('profile', b.profile)
  }
  if (b.weather && typeof b.weather.temperature_c === 'number') {
    PROFILE.temperature = Math.round(b.weather.temperature_c)
    swrWrite('weather', PROFILE.temperature)
  }
  renderHeader(getHeaderData())
  if (b.health) {
    cache.health = b.health
    swrWrite('health', b.health)
    renderHealth(b.health)
  }
  if (tzChanged) {
    loadTasks().then(d => { cache.tasks = d; swrWrite('tasks', d); renderTasks(d) }).catch(() => {})
    loadCalendar().then(d => { cache.cal = d; swrWrite('cal', d); renderCalendar(d) }).catch(() => {})
  }
})

/* Проактивный pull Whoop — если после 3 утра и за сегодня данных нет.
 * После успеха перезапросим bundle (профиль/погода кэшируются на сервере). */
maybeRefreshWhoop().then(refreshed => {
  if (refreshed) loadHomeBundle().then(b => {
    if (!b?.health) return
    cache.health = b.health
    swrWrite('health', b.health)
    renderHealth(b.health)
  })
})

Promise.allSettled([
  loadJapa().then(d => { cache.japa = d; swrWrite('japa', d); renderJapa(d) }),
  loadTasks().then(d => { cache.tasks = d; swrWrite('tasks', d); renderTasks(d) })
    .catch(err => {
      console.error('tasks load failed', err)
      cache.tasks = { state: 'empty', counters: null, todays: [], overdue: [], doneToday: [] }
      renderTasks(cache.tasks)
    }),
  loadCalendar().then(d => { cache.cal = d; swrWrite('cal', d); renderCalendar(d) }),
])

</script>
